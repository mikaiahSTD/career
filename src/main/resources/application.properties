spring.config.import=optional:file:.env[.properties]
spring.application.name=career
server.port=9090
server.forward-headers-strategy=framework
api.version=1.43

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/career}
spring.datasource.username=${DB_USERNAME:career_manager}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=com.rmm.std.conf.CustomPostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

aws.s3.bucket=${AWS_S3_BUCKET:career-storage-bucket}
aws.eventBridge.bus=${AWS_EVENTBRIDGE_BUS:default}
app.s3.presign-duration=${S3_PRESIGN_DURATION:1440m}

app.jwt.secret=${JWT_SECRET:U3VwZXJMb25nRW5jb2RlZEJhc2U2NFNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uTjY=}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}


app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.ref=${BOOTSTRAP_ADMIN_REF:admin-bootstrap}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@mail.hei.school}
app.bootstrap-admin.firstname=${BOOTSTRAP_ADMIN_FIRSTNAME:System}
app.bootstrap-admin.lastname=${BOOTSTRAP_ADMIN_LASTNAME:Admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Password123!}
