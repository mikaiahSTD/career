<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Login</h1>
    <p class="auth-subtitle">Sign in to your career dashboard</p>

    <div id="alert" class="alert alert-error" role="alert"></div>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="auth-links">
      <a th:href="@{/ui/signup}">Don't have an account? Sign up</a>
    </p>
  </main>

  <script th:src="@{/js/ui.js}"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var alertEl = document.getElementById('alert');
      var btn = e.target.querySelector('button[type=submit]');

      alertEl.style.display = 'none';
      btn.disabled = true;

      CareerUI.apiJson('/auth/login', {
        method: 'POST',
        noAuthRedirect: true,
        body: {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        }
      })
        .then(function (data) {
          window.location.href = data.role === 'ADMIN' ? '/ui/promotions' : '/ui';
        })
        .catch(function (err) {
          alertEl.textContent = err.message || 'Login failed';
          alertEl.style.display = 'block';
        })
        .finally(function () {
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
