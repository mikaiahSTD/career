<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Promotions</title>
  </head>
  <body>
    <h1>Promotions</h1>
    <ul>
      <li th:each="promotionId : ${promotions}">
        <a th:href="@{/promotions/{id}/graduates/export(id=${promotionId})}">
          Export graduates of <span th:text="${promotionId}"></span>
        </a>
      </li>
    </ul>
  </body>
</html>
