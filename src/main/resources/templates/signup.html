<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Sign Up</h1>
    <p class="auth-subtitle">Create your account</p>

    <div id="alert" class="alert alert-error" role="alert"></div>

    <form id="signup-form" novalidate>
      <label for="ref">Ref</label>
      <input type="text" id="ref" name="ref" autocomplete="off" required />

      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" autocomplete="family-name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required />

      <p class="auth-subtitle">Accounts created here are student accounts. Teacher and admin accounts are created by an administrator.</p>

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="auth-links">
      <a th:href="@{/ui/login}">Already have an account? Login</a>
    </p>
  </main>

  <script th:src="@{/js/ui.js}"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var alertEl = document.getElementById('alert');
      var btn = e.target.querySelector('button[type=submit]');

      alertEl.style.display = 'none';
      btn.disabled = true;

      CareerUI.apiJson('/auth/register', {
        method: 'POST',
        body: {
          ref: document.getElementById('ref').value,
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: 'STUDENT'
        }
      })
        .then(function () {
          window.location.href = '/ui/login';
        })
        .catch(function (err) {
          alertEl.textContent = err.message || 'Registration failed';
          alertEl.style.display = 'block';
        })
        .finally(function () {
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
